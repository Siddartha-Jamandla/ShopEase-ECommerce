<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Page Not Found - ShopEase</title>

    <meta
        name="description"
        content="The page you're looking for doesn't exist. Continue shopping 62 hand-picked products at ShopEase."
    >

    <link
        rel="icon"
        href="assets/images/logo/favicon.svg"
        type="image/svg+xml"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>
        .not-found {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .not-found-code {
            font-size: 96px;
            font-weight: 800;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 16px;
        }

        .not-found h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .not-found p {
            color: #6b7280;
            max-width: 420px;
            margin-bottom: 28px;
        }

        .not-found-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>

</head>

<body>

    <main class="not-found">

        <div class="not-found-code">404</div>

        <h1>This page went shopping without you</h1>

        <p>
            The page you're looking for doesn't exist or was moved.
            Let's get you back to the good stuff.
        </p>

        <div class="not-found-actions">

            <a
                href="index.html"
                class="btn btn-primary"
            >Back to Home</a>

            <a
                href="shop.html"
                class="btn btn-outline"
            >Browse Products</a>

        </div>

    </main>

</body>

</html>
